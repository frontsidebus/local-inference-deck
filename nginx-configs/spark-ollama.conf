# 343 Guilty Spark — CURRENT-GENERATION nginx config (Ollama backend).
#
# This is the template for the live EC2 config. Installed path:
#   /etc/nginx/sites-available/343-guilty-spark
# enabled by symlink:
#   sudo ln -s /etc/nginx/sites-available/343-guilty-spark \
#              /etc/nginx/sites-enabled/343-guilty-spark
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace the following placeholders before reloading nginx:
#   REPLACE_WITH_DOMAIN       the served domain (live: 343-guilty-spark.io)
#   REPLACE_WITH_VLLM_BEARER  bearer token for the PARKED vLLM block only —
#                             not needed while that block stays parked, and
#                             never committed with a real value
#
# The `listen 443 ssl` + `ssl_*` + Let's Encrypt lines below are what certbot
# writes. If you are bootstrapping a fresh host, start from a plain
# `listen 80;` server block with no ssl_* directives, run
# `sudo certbot --nginx -d REPLACE_WITH_DOMAIN`, and let certbot inject them;
# then reconcile against this file. Live is serving HTTP/2 on a valid LE
# certificate.
#
# Supersedes nginx-configs/nginx.conf, which targets the PARKED vLLM
# architecture. Both are kept: vLLM returns when the ProArt board upgrade
# lands (see ARCHITECTURE.md section 3.1).

server {
    listen 443 ssl http2;
    server_name REPLACE_WITH_DOMAIN www.REPLACE_WITH_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/REPLACE_WITH_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_WITH_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Static UI — single-page vanilla JS app, no framework, no build step.
    root  /var/www/spark;
    index index.html;

    # Gate EVERYTHING behind basic auth: the static UI and the inference
    # proxy alike. Declared at server level so every location below inherits
    # it; the inference endpoint must never be reachable without it, because
    # Ollama itself does no authentication at all (ARCHITECTURE.md section 7).
    #
    # The realm string is what the browser shows in its credential prompt,
    # so it is user-visible copy and matches the site identity exactly.
    #
    # IMPORTANT, because this has repeatedly caused confusion: nginx has NO
    # `.htaccess` support. Per-directory `.htaccess` files are an Apache
    # feature and nginx will not read them, not even if one is dropped in the
    # web root. The ONLY mechanism here is `auth_basic` plus an htpasswd file
    # referenced by `auth_basic_user_file`. Create/update it with:
    #   sudo htpasswd -c /etc/nginx/.htpasswd <user>   # -c only the first time
    # The file itself is gitignored and must never be committed.
    auth_basic           "343 Guilty Spark";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- ACTIVE: Ollama inference proxy ---------------------------------
    #
    # This is the only live inference path. The UI posts
    # `POST /v1/llama/chat/completions` with {model, messages, stream: true};
    # the rewrite strips the `/v1/llama` prefix so Ollama sees its own
    # OpenAI-compatible route `/v1/chat/completions`. `break` stops rewrite
    # processing and keeps the request in this location rather than
    # re-running location matching.
    #
    # nginx matches prefix locations by LONGEST PREFIX, not by file order, so
    # `/v1/llama/` wins over the `/v1/` catch-all below regardless of which
    # is declared first. It must nonetheless be declared: without it, these
    # requests would fall through to `/v1/` and be proxied to the parked vLLM
    # port. Do not delete it while leaving `/v1/` in place.
    #
    # 10.100.0.2:11434 is the VM's WireGuard address — Ollama is bound only
    # to that interface, so this proxy_pass only works over the tunnel.
    location /v1/llama/ {
        rewrite ^/v1/llama/(.*) /v1/$1 break;
        proxy_pass         http://10.100.0.2:11434;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   Connection "";

        # Note the absence of an Authorization override here, unlike the
        # parked vLLM block below: Ollama has no API key, so the browser's
        # inherited basic-auth header simply travels upstream and Ollama
        # ignores it. Basic auth is doing all the access control.

        # WHY buffering must be off: the UI streams tokens over SSE. With
        # proxy_buffering on (the default), nginx accumulates upstream
        # chunks into its own buffers and flushes them in batches, so
        # instead of a smooth token-by-token stream the user sees text
        # arrive in jerky bursts — or nothing at all until a buffer fills.
        # Turning it off makes nginx forward each chunk as it arrives.
        # proxy_cache off is belt-and-braces for the same reason: a
        # streaming response must never be buffered or cached.
        proxy_buffering    off;
        proxy_cache        off;

        # WHY 600s: the backend generates at ~19 tok/s (70B Q4_K_M across two
        # RTX 3090s, one on a PCIe x1 link). A long answer legitimately holds
        # the connection open for minutes with no single gap being an error,
        # and the default 60s read timeout would cut the stream off
        # mid-generation. 600s is generous enough that only a genuinely hung
        # backend trips it. A cold start also costs 15-20s of silence before
        # the first token unless ollama-preload.service has already warmed
        # the model.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---- PARKED: vLLM catch-all (INACTIVE — backend not running) --------
    #
    # Kept deliberately, not dead code. Nothing is listening on
    # 10.100.0.2:8000 today: the vLLM architecture is parked because
    # tensor-parallel inference bottlenecks on the PCIe 4.0 x1 link feeding
    # the second 3090. It returns when the ASUS ProArt X870E-Creator board
    # upgrade enables x8/x8 bifurcation (ARCHITECTURE.md section 3.1), at
    # which point this block is the path back.
    #
    # Harmless while parked because the UI only ever calls `/v1/llama/`,
    # never `/v1/` directly. Any request that does reach here will fail with
    # a 502.
    #
    # The browser never sends a bearer token — nginx injects one here,
    # overwriting whatever Authorization header arrived (which will be the
    # browser's basic auth credentials). The real token lives on the sandbox
    # at ~/.config/spark/api_key and is NEVER committed; substitute it at
    # install time, and only when actually un-parking vLLM.
    location /v1/ {
        proxy_set_header   Authorization "Bearer REPLACE_WITH_VLLM_BEARER";

        proxy_pass         http://10.100.0.2:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   Connection "";

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# Plain HTTP exists only to bounce clients to TLS. Note that a blanket 301
# here also redirects /.well-known/acme-challenge/, so if certificate
# renewal ever starts failing, check that certbot's renewal path is still
# able to answer the HTTP-01 challenge on port 80 (or switch renewal to a
# webroot/standalone authenticator).
server {
    listen 80;
    server_name REPLACE_WITH_DOMAIN www.REPLACE_WITH_DOMAIN;
    return 301 https://$host$request_uri;
}
