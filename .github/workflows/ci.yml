# In-tree CI (step 0a). Tests run offline (no network access from the tests themselves) and
# single-threaded. Only distro packages are installed; nothing reads a real site.env.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Install tools (Ubuntu packages)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            python3-pytest python3-yaml python3-jsonschema gettext-base shellcheck
      # deck-tools (tools/deck-tools/README.md): every file matches tools/tools.lock (content and mode), and on a
      # pull request an engine change since the base must come with a version bump
      - name: deck-tools verify
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 tools/deck-tools/deck-tools verify
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            python3 tools/deck-tools/deck-tools verify --base FETCH_HEAD
          fi
      - name: walter tests
        run: python3 -m pytest walter/tests walter/firewall/tests -q -p no:cacheprovider
      - name: gateway tests
        run: python3 -m pytest walter/gateway/tests -q -p no:cacheprovider
      - name: sanitizer tests (scripts/ shims and tools/deck-tools engines)
        run: python3 -m pytest scripts/tests -q -p no:cacheprovider
      # tools/tests also covers bin/deck evals / install evals / check against a fake sec-evals checkout, and C1
      # coverage of sec-evals' vendored evals.env.example
      - name: site-key registry (C1) and deck env/check/evals tests
        run: |
          python3 -B tools/site_keys.py validate
          python3 -B tools/site_keys.py policy --check
          python3 -m pytest tools/tests -q -p no:cacheprovider
      # 0b contracts (contracts/README.md): vendored copies and generated files current, the deck's provider and
      # consumer tests (offline: temp dirs and a loopback fake gateway only). agent-judge (step 2) and sec-evals (step 3)
      # are their own repos: their contract tests run in their CI, and here only the deck's side of C3-C10 runs.
      - name: contract artifacts current
        run: |
          python3 contracts/tools/contracts.py vendor
          python3 contracts/tools/contracts.py aliases
          python3 contracts/tools/contracts.py vectors
      - name: contract tests (deck)
        run: python3 -m pytest contracts/tests -q -p no:cacheprovider
      - name: check-sanitized (generic secret shapes; no real values in CI)
        run: CI=true bash scripts/check-sanitized.sh --all --regex-only
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh scripts/secrets.d/*.sh hooks/pre-commit tools/deck-tools/*.sh tools/deck-tools/pre-commit

  # sec-evals at the commit deck.lock names, against this repo's real llama-swap template: its needs_deck_template
  # tests (the C1 D8 pins in plans/c1-interventions.json are the template's flash cmd) skip in sec-evals' own CI,
  # so a template change that breaks a pinned intervention fails here, in the PR that makes it.
  sec-evals-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: sec-evals commit from deck.lock
        id: lock
        run: |
          python3 -B -c 'import sys; sys.path.insert(0, "tools"); import site_keys as sk
          (c,) = [c for c in sk.load_registry("deck.lock")["components"] if c["name"] == "sec-evals"]
          print("commit=" + c["commit"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/sec-evals
          ref: ${{ steps.lock.outputs.commit }}
          path: sec-evals
          persist-credentials: false
      - name: Install tools (Ubuntu packages)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-pytest python3-numpy
      - name: sec-evals tests against the deck's walter template
        working-directory: sec-evals
        env:
          SPARK_LLAMA_SWAP_TEMPLATE: ${{ github.workspace }}/walter/llama-swap/config.yaml.tmpl
        run: |
          set -o pipefail
          test -f "$SPARK_LLAMA_SWAP_TEMPLATE"
          python3 -m pytest evals/tests -q -p no:cacheprovider -rs | tee "$RUNNER_TEMP/sec-evals.txt"
          # the point of this job: the template tests must have run, not skipped
          ! grep -q "needs the deck's walter llama-swap template" "$RUNNER_TEMP/sec-evals.txt"

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read   # the action lists a PR's commits to scan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9 (= v2)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
