# In-tree CI (step 0a). Tests run offline (no network access from the tests themselves) and
# single-threaded. Only distro packages are installed; nothing reads a real site.env.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Install tools (Ubuntu packages)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            python3-pytest python3-yaml gettext-base shellcheck
      - name: walter tests
        run: python3 -m pytest walter/tests walter/firewall/tests -q -p no:cacheprovider
      - name: gateway tests
        run: python3 -m pytest walter/gateway/tests -q -p no:cacheprovider
      - name: sanitizer tests
        run: python3 -m pytest scripts/tests -q -p no:cacheprovider
      - name: check-sanitized (generic secret shapes; no real values in CI)
        run: CI=true bash scripts/check-sanitized.sh --all --regex-only
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh scripts/secrets.d/*.sh hooks/pre-commit

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read   # the action lists a PR's commits to scan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pinned by major tag only (no verified sha at hand): pin to a commit sha before relying on it.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
