# contracts/site-keys.yaml: the C1 site-config registry (deck-owned). One entry per key in site.env.example,
# active or commented out. Edit this file AND site.env.example together when you add, rename or remove a key:
# tools/tests/test_site_keys.py fails until both agree. No site values here: `default` is the example value,
# copied exactly as written in site.env.example (quotes included).
#
# Format: a constrained YAML subset, so the stdlib can read it (tools/site_keys.py) and any YAML parser
# agrees. Only these line shapes are allowed:
#   `# comment` / blank lines;   `name: <JSON scalar>` (top level);   `name:` opening a list;
#   `  - {JSON object on one line}` (a list item).
# Each list item is one JSON object, which is also a valid YAML flow mapping.
#
# Key fields: name; active (false = commented out in site.env.example); owner (the component that defines the
# key's meaning); consumers (the components whose code, templates or docs read it); required (a deploy refuses
# to run when it is absent or empty); default (the example value); sanitize (a class from sanitize_classes:
# how scripts/check-sanitized.sh treats a real value); note (optional).
#
# Derived files: contracts/sanitize-policy.yaml (python3 tools/site_keys.py policy). `bin/deck env slice
# <component>` writes the keys a component owns or consumes; `bin/deck check` checks site.env against this file.
contract_version: 1
components:
  - {"name": "global", "description": "shared core (identity, network); scripts/render.sh, gen-secrets.sh and check-sanitized.sh read the whole site env"}
  - {"name": "walter", "description": "backend VM: walter/deploy.sh and the walter/**/*.tmpl templates it renders (the digest app included)"}
  - {"name": "covenant", "description": "edge: covenant/deploy.sh (--env FILE), its scripts and scripts/secrets.d/covenant.sh"}
  - {"name": "digest", "description": "optional digest app: walter/digest (deployed by walter/deploy.sh, gated on the edge by covenant)"}
  - {"name": "clients", "description": "workstation harnesses: clients/install.sh, clients/bin/spark-model, clients/hermes templates"}
  - {"name": "judge", "description": "agent judge (the agent-judge repo): its judge/lib/config.py and sitemask.py read the full site env", "slice": false, "slice_refusal": "the judge is exempt from slicing: its judge/lib/sitemask.py (agent-judge repo) can only mask the site values it knows, so the judge must read the full site env"}
  - {"name": "evals", "description": "eval harness, the sec-evals repo (its example: evals.env.example, vendored in contracts/vendored/sec-evals/): evals/tools/lib.sh site_value, evals/gate.py, evals/run.py"}
  - {"name": "hypervisor", "description": "host layer (docs only): hypervisor/README.md"}
sanitize_classes:
  - {"name": "check", "action": "check", "description": "a real value that differs from the example is forbidden in tracked files"}
  - {"name": "check-list", "action": "split", "description": "space-separated list: each item is checked on its own"}
  - {"name": "names", "action": "skip", "description": "user/key names: list the real ones in .sanitize-words (whole words) instead"}
  - {"name": "generic", "action": "skip", "description": "ports, interfaces, group and client ids, generic paths and users: not identifying"}
  - {"name": "judge-knob", "action": "skip", "description": "judge policy knobs (modes, model aliases, caps): public values"}
# For keys that are not listed below (first match wins; `key` is a shell glob; anything else is checked).
sanitize_fallback:
  - {"key": "*_PORT", "sanitize": "generic"}
  - {"key": "*_IF", "sanitize": "generic"}
  - {"key": "*_GROUP", "sanitize": "generic"}
  - {"key": "*_CLIENT_ID", "sanitize": "generic"}
  - {"key": "JUDGE_*", "sanitize": "judge-knob"}
