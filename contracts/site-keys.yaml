  - {"name": "SPARK_CHAT_HOST", "active": true, "owner": "global", "consumers": ["walter", "covenant", "judge"], "required": true, "default": "chat.example.com", "sanitize": "check"}
  - {"name": "SPARK_API_HOST", "active": true, "owner": "global", "consumers": ["walter", "covenant", "clients", "judge", "evals"], "required": true, "default": "api.example.com", "sanitize": "check"}
  - {"name": "SPARK_ID_HOST", "active": true, "owner": "global", "consumers": ["walter", "covenant", "judge"], "required": true, "default": "id.example.com", "sanitize": "check"}
