# Phase 3 http-context settings (Covenant edge)
server_tokens off;

# Rate/conn limit zones (per client IP)
limit_req_zone  $binary_remote_addr zone=chat_login:10m rate=5r/m;
limit_req_zone  $binary_remote_addr zone=api_req:10m    rate=10r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;
limit_req_zone  $binary_remote_addr zone=id_auth:10m    rate=10r/m;
limit_req_zone  $binary_remote_addr zone=id_oidc:10m    rate=10r/s;
limit_req_status  429;
limit_conn_status 429;

# Websocket upgrade helper
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# API pre-filter: 1 when neither Authorization nor x-api-key is present
map "$http_authorization$http_x_api_key" $api_no_credentials {
    ""      1;
    default 0;
}
