# /etc/nginx/sites-available/spark
#
# Replace the following placeholders before reloading nginx:
#   REPLACE_WITH_DOMAIN     your domain, e.g. example.com
#   REPLACE_WITH_VLLM_IP    the local sandbox's WireGuard IP, e.g. 10.100.0.2
#   REPLACE_WITH_VLLM_PORT  the port vLLM listens on, e.g. 8000
#   REPLACE_WITH_BEARER     the bearer token vLLM was started with
#                           (read from ~/.config/spark/api_key on the sandbox)
#
# After running `certbot --nginx -d <domain>`, the listen 443 + ssl_*
# directives will be rewritten by certbot. The version below assumes that
# has already happened — if you are bootstrapping for the first time, start
# with a plain `listen 80;` server block (no ssl_*) and let certbot inject
# the rest.

server {
    listen 443 ssl http2;
    server_name REPLACE_WITH_DOMAIN www.REPLACE_WITH_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/REPLACE_WITH_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_WITH_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/spark;
    index index.html;

    # Gate everything behind basic auth
    auth_basic           "Spark";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Static UI
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Inference proxy.
    # Basic auth is inherited from the server block.
    # The browser never sends a bearer token — nginx injects one here,
    # overwriting any incoming Authorization header (which will be the
    # browser's basic auth credentials).
    location /v1/ {
        proxy_set_header   Authorization "Bearer REPLACE_WITH_BEARER";

        proxy_pass         http://REPLACE_WITH_VLLM_IP:REPLACE_WITH_VLLM_PORT;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   Connection "";

        # SSE streaming requires buffering OFF; otherwise nginx batches
        # chunks and the UI updates in jerks instead of streaming smoothly.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    listen 80;
    server_name REPLACE_WITH_DOMAIN www.REPLACE_WITH_DOMAIN;
    return 301 https://$host$request_uri;
}
