# deck.lock: the components that live in their own repos, as local-inference-deck composes them (plan §3).
# No site values. Format: the constrained YAML subset of contracts/site-keys.yaml (one JSON object per list
# item), so tools/site_keys.py reads it with the stdlib. `bin/deck check` checks it.
#
# Fields: name; repo (clone URL); tag (release); commit (the tag's commit); mode; path (the stable checkout path:
# SPARK_EVAL_REPOS, JUDGE_INFRA_REPOS and the liveness guard rely on it); requires_contracts (contract name ->
# accepted major version).
# - mode "pinned": the checkout must be at `commit`.
# - mode "minimum": a working checkout; `commit` must be an ancestor of its HEAD. deck warns otherwise and never
#   moves HEAD (sec-evals commits its attempts ledger after each confirmatory run).
# repo and tag stay null until the repo is published and tagged (commit: the prepared sec-evals tip, which a push
# keeps); a null commit skips the ancestor check.
lock_format: 1
components:
  - {"name": "sec-evals", "repo": null, "tag": null, "commit": "778840bcf8c4900844ed57b5019c1436a8531447", "mode": "minimum", "path": "~/src/deck/sec-evals", "requires_contracts": {"serving-identity": "1", "eval-liveness": "1", "gate-cli": "1"}}
