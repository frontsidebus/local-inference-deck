# Example of /models/registry.yaml (site-local; the real file is never committed). spark-model-agent writes it;
# schema and runbook: walter/models/README.md. Values below are made up.
schema: spark-model-registry-v1
models:
  - id: example-abliterated-8b          # ^[a-z0-9][a-z0-9.-]{0,38}[a-z0-9]$ ; llama-swap id lab-<id>
    repo: someorg/Some-Model-8B-GGUF     # the org must be in site.env LAB_HF_ORGS
    revision: 0123456789abcdef0123456789abcdef01234567   # 40-hex commit, resolved once at pull
    files:                               # every file, stored flat in /models/gguf/lab/<id>/
      - {path: Q4_K_M/Some-Model-8B-Q4_K_M-00001-of-00002.gguf, bytes: 2500000000,
         sha256: "1111111111111111111111111111111111111111111111111111111111111111", role: model}
      - {path: Q4_K_M/Some-Model-8B-Q4_K_M-00002-of-00002.gguf, bytes: 2400000000,
         sha256: "2222222222222222222222222222222222222222222222222222222222222222", role: model}
    placement: gpu1                      # gpu0 | gpu1 | both
    ctx: 32768
    n_max: 8192                          # -n output backstop
    image: image                         # image | image-next (llama-swap macros)
    split: layer                         # both only: layer | tensor
    cpu_experts: null                    # both only: -ot regex of MoE expert tensors kept on the CPU
    sampling: {temp: 0.7, top_p: 0.95}   # temp top_p top_k min_p typical_p presence_penalty frequency_penalty repeat_penalty
    extra_args: []                       # whitelist only, see README
    ttl: 900
    class: abliterated                   # uncensored | abliterated | specialized | base
    tools_allowed: false
    license: {id: apache-2.0, flag: null, gated: false}
    template: {source: embedded, sha256: "3333333333333333333333333333333333333333333333333333333333333333",
               bytes: 4120, flags: [], reviewed: false}
    fit: {vram_gb: [0.0, 9.1], speed_class: B}
    enabled: false                       # Phase 1: always false; the renderer ignores disabled models
    pinned: false
    added: "2026-10-14T00:00:00Z"
    last_used: null
