# systemd drop-in for the Ollama service, running inside the VM
# `agent-sandbox-3090`.
#
# Install path (the directory does not exist on a fresh Ollama install and
# must be created):
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo install -m 0644 ollama-override.conf \
#       /etc/systemd/system/ollama.service.d/override.conf
#
# A drop-in is not picked up until systemd re-reads unit state, and the
# environment is only applied to a freshly forked process, so BOTH steps
# are required:
#   sudo systemctl daemon-reload
#   sudo systemctl restart ollama
#
# Verify afterwards with:
#   sudo ss -tlnp | grep 11434
#
# !! THIS FILE MATCHES LIVE STATE, WHICH IS NOT THE HARDENED STATE !!
# Verified on the VM 2026-09-22: the running service has
# OLLAMA_HOST=0.0.0.0:11434 and `ss` reports `LISTEN *:11434`. Ollama is
# therefore listening on EVERY interface the VM has, and answers 200 on the
# libvirt NAT address (10.127.10.160:11434) from inside the guest.
#
# What actually keeps that from being reachable is ufw, NOT the bind
# address:
#   11434/tcp on wg0   ALLOW IN   Anywhere
#   -A ufw-user-input -i wg0 -p tcp --dport 11434 -j ACCEPT
# ufw's default incoming policy is deny, and that rule is scoped to the wg0
# interface, so traffic arriving on any other interface is dropped. From the
# host, curling 10.127.10.160:11434 times out for exactly this reason.
#
# Consequence: the ufw rule is load-bearing for SECURITY, not merely for
# connectivity. `ufw disable`, a flushed ruleset, or dropping the interface
# scope would immediately expose an unauthenticated 70B endpoint on the
# libvirt network. See the hardening note on OLLAMA_HOST below.
#
# NOTE: this drop-in only overrides the three Environment lines below. Every
# other directive is inherited from the vendor unit shipped by the Ollama
# installer, which is deliberate — it keeps us off the upgrade treadmill.

[Service]
# Ollama defaults to 127.0.0.1:11434, which the tunnel cannot reach, so it
# has to be widened. Live currently uses 0.0.0.0 — every interface — and
# relies entirely on the ufw wg0 scope (see header) to constrain it.
Environment="OLLAMA_HOST=0.0.0.0:11434"

# RECOMMENDED HARDENING (not yet applied to live; a deliberate change, so
# left for the operator):
#
#   Environment="OLLAMA_HOST=10.100.0.2:11434"
#
# Binding the socket to the WireGuard address itself makes the kernel refuse
# to accept the connection on any other interface, giving a second,
# independent control alongside ufw rather than depending on ufw alone. That
# is the difference between defense-in-depth and a single point of failure,
# and it matters more than usual here because Ollama has no auth of its own.
#
# The catch, and the likely reason live is 0.0.0.0: bind() to 10.100.0.2
# fails with EADDRNOTAVAIL if wg0 has not configured that address yet, so
# ollama.service would gain a real startup-ordering dependency on
# wg-quick@wg0.service. Applying it means also adding, in this same drop-in:
#   After=wg-quick@wg0.service
#   Wants=wg-quick@wg0.service
# and accepting that a tunnel failure then keeps Ollama down instead of
# leaving it up but unreachable. Test with a reboot, not just a restart --
# a restart succeeds while wg0 happens to already be up and hides the race.

# WHY: the default keep-alive is 5 minutes, after which Ollama evicts the
# model from VRAM. Reloading 70B Q4_K_M costs 15-20 seconds, and the second
# card sits on a PCIe 4.0 x1 link, so that reload is not cheap. -1 disables
# eviction entirely: the ~42 GB load is paid once and the model stays
# resident, so every query after the first is a warm start (0s).
Environment="OLLAMA_KEEP_ALIVE=-1"

# WHY: with 48 GB of VRAM and ~42 GB consumed by this one model there is no
# room for a second large model, so concurrency has to come from sharing the
# single loaded copy rather than loading more of them. 2 lets two requests
# be served against the same resident weights instead of one queueing behind
# the other. Raising this grows the KV-cache allocation, which the ~6 GB of
# headroom does not have room for.
Environment="OLLAMA_NUM_PARALLEL=2"
