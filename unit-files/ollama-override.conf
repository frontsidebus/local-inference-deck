# systemd drop-in for the Ollama service, running inside the VM
# `agent-sandbox-3090`.
#
# Install path (the directory does not exist on a fresh Ollama install and
# must be created):
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo install -m 0644 ollama-override.conf \
#       /etc/systemd/system/ollama.service.d/override.conf
#
# A drop-in is not picked up until systemd re-reads unit state, and the
# environment is only applied to a freshly forked process, so BOTH steps
# are required:
#   sudo systemctl daemon-reload
#   sudo systemctl restart ollama
#
# Verify afterwards with:
#   sudo ss -tlnp | grep 11434
# After applying this file that must read 10.100.0.2:11434, NOT *:11434.
# If it still shows *:11434 the drop-in did not take effect.
#
# !! THIS IS THE HARDENED TARGET, NOT YET LIVE !!
# Apply it during a maintenance window using
# docs/reboot-validation-checklist.md. Until then the running VM still has
# OLLAMA_HOST=0.0.0.0:11434 and `ss` reports `LISTEN *:11434` (verified
# 2026-09-22), meaning Ollama listens on every interface the VM has and
# answers 200 on the libvirt NAT address from inside the guest.
#
# In that state the only thing confining Ollama to the tunnel is ufw:
#   11434/tcp on wg0   ALLOW IN   Anywhere
#   -A ufw-user-input -i wg0 -p tcp --dport 11434 -j ACCEPT
# One rule, no second layer. `ufw disable`, a flushed ruleset, or losing the
# interface scope would immediately publish an unauthenticated 70B endpoint
# onto the libvirt network. This file closes that gap by making the kernel
# refuse off-tunnel connections too, so ufw becomes the second control
# rather than the only one.
#
# NOTE: this drop-in only overrides the three Environment lines below. Every
# other directive is inherited from the vendor unit shipped by the Ollama
# installer, which is deliberate — it keeps us off the upgrade treadmill.

# Ordering: these MUST live under [Unit], not [Service]. A drop-in may carry
# both sections; putting After=/Requires= under [Service] is silently
# ignored, which would leave the race below unfixed while looking fixed.
[Unit]
# Binding to 10.100.0.2 fails with EADDRNOTAVAIL unless wg0 has already
# configured that address, so the ordering is load-bearing, not cosmetic.
#
# After= is sufficient and correct here: wg-quick@wg0.service is
# Type=oneshot with RemainAfterExit=yes and ExecStart=`wg-quick up wg0`
# (ignore_errors=no), so by the time systemd considers it active the address
# exists. Verified on the VM.
After=wg-quick@wg0.service

# Requires=, NOT Wants=. This is the important choice and it is easy to get
# wrong (an earlier draft of this file recommended Wants=).
#
# The vendor Ollama unit ships Restart=always with RestartUSec=3s. With
# Wants=, a tunnel failure lets Ollama start anyway, bind() fails, and
# systemd restarts it every 3 seconds forever -- a silent crash-loop, which
# is the exact failure mode ARCHITECTURE.md section 10 warns about after it
# cost hours once already. Requires= refuses to start Ollama at all if wg0
# did not come up, so the failure is loud, singular, and obvious in
# `systemctl status`.
#
# The trade is real: a transient wg0 failure now keeps Ollama down until
# someone intervenes, instead of leaving it up but unreachable. For an
# endpoint that is useless without the tunnel, failing closed is the better
# default -- but it is a choice, so it is written down rather than implied.
Requires=wg-quick@wg0.service

[Service]
# Bind to the WireGuard address specifically, so the kernel itself refuses
# connections arriving on any other interface. This is the second,
# independent control alongside the ufw rule (see header) -- the difference
# between defense-in-depth and a single point of failure. It matters more
# than usual here because Ollama has no authentication of its own.
Environment="OLLAMA_HOST=10.100.0.2:11434"

# NOT YET HANDLED, and worth knowing before you rely on this: if wg0 is
# torn down and re-established while Ollama is running, the address its
# socket is bound to disappears and Ollama does not recover on its own --
# Requires= governs startup ordering, not the running state. Restarting
# Ollama after any wg0 bounce is the manual fix. `BindsTo=` plus
# `PartOf=wg-quick@wg0.service` would automate it by stopping Ollama with
# the tunnel, but that couples a 15-20s model reload to every tunnel blip,
# so it is deliberately left off pending evidence that wg0 actually flaps.


# WHY: the default keep-alive is 5 minutes, after which Ollama evicts the
# model from VRAM. Reloading 70B Q4_K_M costs 15-20 seconds, and the second
# card sits on a PCIe 4.0 x1 link, so that reload is not cheap. -1 disables
# eviction entirely: the ~42 GB load is paid once and the model stays
# resident, so every query after the first is a warm start (0s).
Environment="OLLAMA_KEEP_ALIVE=-1"

# WHY: with 48 GB of VRAM and ~42 GB consumed by this one model there is no
# room for a second large model, so concurrency has to come from sharing the
# single loaded copy rather than loading more of them. 2 lets two requests
# be served against the same resident weights instead of one queueing behind
# the other. Raising this grows the KV-cache allocation, which the ~6 GB of
# headroom does not have room for.
Environment="OLLAMA_NUM_PARALLEL=2"
